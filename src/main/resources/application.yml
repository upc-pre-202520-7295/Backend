spring:
  application:
    name: ${APP_NAME:betalyze}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bet2}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}  # ✅ Cambiado a true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true  # ✅ Agregado
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: ${APP_TIMEZONE:UTC}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

# Firebase Configuration
firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH:./firebase-service-account.json}

# Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    enabled: ${SWAGGER_UI_ENABLED:true}

# Logging
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}  # ✅ Cambiado de ERROR a INFO
    com.betalyze: ${LOG_LEVEL_APP:DEBUG}
    com.betalyze.predictions: DEBUG  # ✅ Agregado específico para predictions
    org.springframework: ${LOG_LEVEL_SPRING:WARN}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:DEBUG}  # ✅ Cambiado a DEBUG
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.apache.catalina: ${LOG_LEVEL_CATALINA:WARN}
    org.hibernate.SQL: DEBUG  # ✅ Agregado - muestra queries SQL
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # ✅ Agregado - muestra parámetros
    org.hibernate.type: TRACE  # ✅ Agregado - muestra tipos de datos

server:
  port: 8091
  error:
    include-message: ${ERROR_INCLUDE_MESSAGE:always}
    include-stacktrace: ${ERROR_INCLUDE_STACKTRACE:always}  # ✅ Cambiado de on_param a always
